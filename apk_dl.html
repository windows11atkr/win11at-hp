<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="windows11at 自作アプリ配布ストア">
<title>windows11at Store</title>

<style>
:root{
  --bg:#f3f5f7;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --text:#172033;
  --muted:#667085;
  --line:#e5e7eb;

  --blue:#0d6efd;
  --cyan:#0dcaf0;
  --green:#20c997;

  --accent:linear-gradient(
    135deg,
    #0d6efd 0%,
    #0dcaf0 52%,
    #20c997 100%
  );

  --shadow:0 12px 35px rgba(17,24,39,.07);
  --shadow-hover:0 18px 45px rgba(17,24,39,.12);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Noto Sans JP",
    sans-serif;

  line-height:1.6;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================================================
   Layout
========================================================= */

.app-shell{
  width:min(1180px,calc(100% - 36px));
  margin:0 auto;
  padding:18px 0 56px;
}


/* =========================================================
   Header
========================================================= */

.topbar{
  display:flex;
  align-items:center;
  gap:18px;

  min-height:64px;

  margin-bottom:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;

  font-weight:800;
  letter-spacing:-.02em;
}

.brand-mark{
  width:42px;
  height:42px;

  border-radius:13px;

  display:grid;
  place-items:center;

  background:var(--accent);
  color:#fff;

  box-shadow:
    0 8px 22px rgba(13,110,253,.20);

  font-size:21px;
}

.brand-text{
  font-size:20px;
}

.brand-sub{
  margin-top:-1px;

  color:var(--muted);

  font-size:11px;
  font-weight:600;
}


/* =========================================================
   Navigation
========================================================= */

.nav{
  display:flex;
  align-items:center;
  gap:4px;

  padding:5px;

  background:rgba(255,255,255,.86);

  border:1px solid rgba(17,24,39,.05);

  border-radius:16px;

  box-shadow:var(--shadow);
}

.nav button{
  border:0;

  background:transparent;
  color:var(--muted);

  padding:9px 13px;

  border-radius:11px;

  font-size:13px;
  font-weight:700;
}

.nav button:hover,
.nav button.active{
  background:#edf6ff;
  color:#0874bd;
}


/* =========================================================
   Search
========================================================= */

.search{
  margin-left:auto;

  width:min(330px,38vw);

  display:flex;
  align-items:center;
  gap:8px;

  padding:10px 13px;

  background:#fff;

  border:1px solid var(--line);

  border-radius:14px;
}

.search svg{
  flex:0 0 auto;
  color:#7a8699;
}

.search input{
  width:100%;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:14px;
}

.search input::placeholder{
  color:#98a2b3;
}


/* =========================================================
   Views
========================================================= */

.view{
  display:none;
}

.view.active{
  display:block;
}


/* =========================================================
   TOPページへ戻る
========================================================= */

.list-home{
  display:flex;
  justify-content:flex-start;

  margin:0 0 18px;
}

.home-button{
  display:inline-flex;
  align-items:center;
  gap:8px;

  border:1px solid #b8d7ef;

  background:#ffffff;
  color:#0874bd;

  padding:11px 17px;

  border-radius:13px;

  font-size:13px;
  font-weight:800;

  box-shadow:
    0 7px 20px rgba(13,110,253,.08);

  transition:
    background .16s ease,
    border-color .16s ease,
    box-shadow .16s ease,
    transform .16s ease;
}

.home-button:hover{
  background:#eef8ff;

  border-color:#86bee7;

  box-shadow:
    0 11px 26px rgba(13,110,253,.13);

  transform:translateY(-1px);
}

.home-button:active{
  transform:translateY(0);

  box-shadow:
    0 5px 14px rgba(13,110,253,.08);
}


/* =========================================================
   Hero
========================================================= */

.hero{
  position:relative;
  overflow:hidden;

  margin-bottom:24px;
  padding:34px 36px;

  color:#fff;

  background:var(--accent);

  border-radius:28px;

  box-shadow:
    0 16px 42px rgba(13,110,253,.18);
}

.hero::before,
.hero::after{
  content:"";

  position:absolute;

  border-radius:50%;

  pointer-events:none;

  background:rgba(255,255,255,.12);
}

.hero::before{
  width:270px;
  height:270px;

  right:-110px;
  top:-145px;
}

.hero::after{
  width:180px;
  height:180px;

  left:-85px;
  bottom:-110px;

  background:rgba(255,255,255,.08);
}

.hero-content{
  position:relative;
  z-index:1;
}

.hero h1{
  margin:0 0 6px;

  font-size:31px;

  letter-spacing:-.03em;
}

.hero p{
  max-width:720px;

  margin:0;

  color:rgba(255,255,255,.92);

  font-size:14px;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;

  margin-top:18px;

  padding:7px 11px;

  border:1px solid rgba(255,255,255,.26);

  border-radius:999px;

  background:rgba(255,255,255,.13);

  font-size:11px;
  font-weight:800;
}


/* =========================================================
   Section
========================================================= */

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:14px;

  margin:0 4px 12px;
}

.section-title{
  font-size:20px;
  font-weight:800;
}

.section-sub{
  color:var(--muted);
  font-size:12px;
}


/* =========================================================
   Grid
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(300px,1fr));

  gap:16px;
}


/* =========================================================
   App Card
========================================================= */

.card{
  padding:20px;

  background:var(--surface);

  border:1px solid rgba(17,24,39,.06);

  border-radius:22px;

  box-shadow:var(--shadow);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.card:hover{
  transform:translateY(-3px);

  border-color:rgba(13,110,253,.14);

  box-shadow:var(--shadow-hover);
}

.card-top{
  display:flex;
  align-items:flex-start;

  gap:14px;
}

.icon{
  width:62px;
  height:62px;

  flex:0 0 auto;

  display:grid;
  place-items:center;

  background:var(--accent);

  border-radius:18px;

  color:#fff;

  box-shadow:
    0 9px 20px rgba(13,110,253,.15);
}

.icon svg{
  width:37px;
  height:37px;
}

.card-title{
  font-size:19px;
  font-weight:800;
  letter-spacing:-.02em;
}

.developer{
  margin-top:1px;

  color:var(--muted);

  font-size:12px;
}

.chips{
  display:flex;
  flex-wrap:wrap;

  gap:6px;

  margin-top:8px;
}

.chip{
  display:inline-flex;
  align-items:center;

  min-height:23px;

  padding:3px 8px;

  border-radius:999px;

  background:#f1f5f9;

  color:#506072;

  font-size:10px;
  font-weight:800;
}

.chip.live{
  background:#e9fbf4;
  color:#138a64;
}

.chip.soon{
  background:#fff5dc;
  color:#9a6500;
}

.desc{
  min-height:61px;

  margin-top:16px;

  color:#4b5563;

  font-size:13px;
}

.card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-top:16px;
  padding-top:14px;

  border-top:1px solid #eef1f4;
}

.card-footer span{
  color:var(--muted);

  font-size:12px;
  font-weight:700;
}

.card-footer span.live{
  color:#138a64;
}

.card-footer span.soon{
  color:#9a6500;
}

.card-link{
  border:0;

  padding:8px 11px;

  border-radius:10px;

  background:#eef6ff;

  color:#0874bd;

  font-size:12px;
  font-weight:800;
}

.card-link:hover{
  background:#e1f0ff;
}


/* =========================================================
   Empty
========================================================= */

.empty{
  grid-column:1 / -1;

  padding:46px 20px;

  text-align:center;

  background:#fff;

  border:1px solid var(--line);

  border-radius:20px;

  color:var(--muted);
}


/* =========================================================
   Detail
========================================================= */

.detail{
  overflow:hidden;

  background:var(--surface);

  border:1px solid rgba(17,24,39,.06);

  border-radius:24px;

  box-shadow:var(--shadow);
}

.detail-head{
  display:flex;
  align-items:center;

  gap:18px;

  padding:28px 30px;

  background:
    linear-gradient(
      180deg,
      #fbfdff 0%,
      #fff 100%
    );

  border-bottom:1px solid #edf0f3;
}

.detail-icon{
  width:88px;
  height:88px;

  flex:0 0 auto;

  display:grid;
  place-items:center;

  background:var(--accent);

  border-radius:24px;

  box-shadow:
    0 12px 28px rgba(13,110,253,.16);
}

.detail-icon svg{
  width:52px;
  height:52px;
}

.detail-title{
  margin:0;

  font-size:29px;
  font-weight:850;

  letter-spacing:-.03em;
}

.detail-dev{
  margin-top:2px;

  color:var(--muted);

  font-size:13px;
}

.detail-chips{
  display:flex;
  flex-wrap:wrap;

  gap:7px;

  margin-top:10px;
}

.detail-body{
  padding:26px 30px 32px;
}


/* =========================================================
   Meta
========================================================= */

.meta-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-bottom:20px;
}

.meta-box{
  padding:13px 14px;

  background:var(--surface-2);

  border:1px solid #edf0f3;

  border-radius:15px;
}

.meta-box strong{
  display:block;

  font-size:14px;
}

.meta-box span{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   Download
========================================================= */

.download-box{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:16px;

  margin-bottom:26px;

  padding:17px 18px;

  background:
    linear-gradient(
      135deg,
      #f8fbff 0%,
      #f2fffb 100%
    );

  border:1px solid rgba(13,110,253,.12);

  border-radius:17px;
}

.download-box strong{
  display:block;

  font-size:14px;
}

.download-box small{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:11px;
}

.primary{
  border:0;

  padding:11px 16px;

  border-radius:12px;

  background:var(--accent);

  color:#fff;

  font-size:13px;
  font-weight:800;

  box-shadow:
    0 8px 18px rgba(13,110,253,.18);

  transition:
    filter .16s ease,
    transform .16s ease;
}

.primary:hover:not(:disabled){
  filter:brightness(.98);

  transform:translateY(-1px);
}

.primary:disabled{
  opacity:.55;

  box-shadow:none;
}


/* =========================================================
   About
========================================================= */

.about-title{
  margin-bottom:8px;

  font-size:17px;
  font-weight:800;
}

.about{
  margin:0;

  color:#4b5563;

  font-size:13px;
}


/* =========================================================
   Features
========================================================= */

.features{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:18px;
}

.feature{
  padding:13px 14px;

  background:#fff;

  border:1px solid #edf0f3;

  border-radius:15px;
}

.feature strong{
  display:block;

  font-size:13px;
}

.feature span{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   Notice
========================================================= */

.notice{
  margin-top:20px;

  padding:13px 14px;

  background:#f8fafc;

  border:1px solid #edf0f3;

  border-radius:14px;

  color:#667085;

  font-size:11px;
}


/* =========================================================
   Back
========================================================= */

.back{
  border:0;

  padding:4px 0;

  background:transparent;

  color:#0874bd;

  font-size:13px;
  font-weight:800;
}


/* =========================================================
   Footer
========================================================= */

footer{
  margin-top:34px;

  text-align:center;

  color:#98a2b3;

  font-size:11px;
}


/* =========================================================
   Loading
========================================================= */

#loading-screen{
  position:fixed;

  inset:0;

  z-index:1000;

  display:grid;
  place-items:center;

  background:#f3f5f7;

  transition:
    opacity .28s ease,
    visibility .28s ease;
}

#loading-screen.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader{
  width:min(360px,calc(100vw - 40px));

  padding:28px;

  text-align:center;

  background:#fff;

  border:1px solid var(--line);

  border-radius:22px;

  box-shadow:var(--shadow);
}

.loader-logo{
  width:58px;
  height:58px;

  display:grid;
  place-items:center;

  margin:0 auto 15px;

  background:var(--accent);

  border-radius:18px;

  color:#fff;

  font-size:28px;
  font-weight:900;
}

.loader-text{
  font-size:13px;
  font-weight:700;
}

.loader-sub{
  margin-top:3px;

  color:var(--muted);

  font-size:11px;
}

.loader-spinner{
  width:22px;
  height:22px;

  margin:14px auto 0;

  border:3px solid #dce6ef;

  border-top-color:#0d6efd;

  border-radius:50%;

  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   Download Modal
========================================================= */

#download-modal{
  position:fixed;

  inset:0;

  z-index:1100;

  display:none;

  place-items:center;

  padding:18px;

  background:rgba(15,23,42,.38);
}

#download-modal.show{
  display:grid;
}

.modal-card{
  width:min(440px,100%);

  padding:24px;

  background:#fff;

  border:1px solid rgba(17,24,39,.08);

  border-radius:22px;

  box-shadow:
    0 26px 70px rgba(15,23,42,.22);
}

.modal-head{
  display:flex;
  align-items:center;

  gap:12px;
}

.modal-icon{
  width:52px;
  height:52px;

  display:grid;
  place-items:center;

  background:var(--accent);

  border-radius:15px;
}

.modal-icon svg{
  width:31px;
  height:31px;
}

.modal-title{
  font-size:16px;
  font-weight:800;
}

.modal-status{
  margin-top:2px;

  color:var(--muted);

  font-size:12px;
}

.progress-wrap{
  margin-top:20px;
}

.progress-track{
  overflow:hidden;

  height:10px;

  background:#e9eef3;

  border-radius:999px;
}

.progress-bar{
  width:0;
  height:100%;

  background:var(--accent);

  border-radius:999px;

  transition:width .16s ease;
}

.progress-meta{
  display:flex;
  justify-content:space-between;

  margin-top:8px;

  color:var(--muted);

  font-size:11px;
  font-weight:700;
}

.modal-note{
  margin-top:14px;

  padding:11px 12px;

  background:#f8fafc;

  border:1px solid #edf0f3;

  border-radius:12px;

  color:#667085;

  font-size:11px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;

  gap:8px;

  margin-top:17px;
}

.modal-cancel{
  border:1px solid #f0c8c5;

  padding:9px 14px;

  background:#fff;

  border-radius:10px;

  color:#b42318;

  font-size:12px;
  font-weight:800;
}

.modal-cancel:hover{
  background:#fff5f4;
}

.modal-done{
  display:none;

  border:0;

  padding:9px 14px;

  background:#172033;

  border-radius:10px;

  color:#fff;

  font-size:12px;
  font-weight:800;
}


/* =========================================================
   Responsive
========================================================= */

@media (max-width:820px){

  .topbar{
    flex-wrap:wrap;
  }

  .nav{
    order:3;

    width:100%;

    overflow:auto;
  }

  .search{
    order:2;

    width:100%;
    max-width:none;

    margin-left:0;
  }

  .meta-grid{
    grid-template-columns:1fr;
  }

  .features{
    grid-template-columns:1fr;
  }

}

@media (max-width:620px){

  .app-shell{
    width:min(100% - 24px,1180px);

    padding-top:12px;
  }

  .hero{
    padding:26px 22px;
  }

  .hero h1{
    font-size:26px;
  }

  .detail-head{
    align-items:flex-start;

    padding:22px;
  }

  .detail-body{
    padding:22px;
  }

  .detail-icon{
    width:74px;
    height:74px;

    border-radius:21px;
  }

  .detail-title{
    font-size:24px;
  }

  .download-box{
    flex-direction:column;
    align-items:stretch;
  }

  .primary{
    width:100%;
  }

  .home-button{
    width:100%;
    justify-content:center;
  }

}
</style>

<style id="k-ui-2-beta">
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&family=DotGothic16&display=swap');

:root {
  --k-bg: #F3F8F6;
  --k-cyan: #00A3FF;
  --k-lime: #00E6A1;
  --k-text: #0F172A;
  --k-sub: #64748B;
  --k-danger: #FF3B30;
  --k-glass: rgba(255,255,255,.65);
  --k-glass-strong: rgba(255,255,255,.76);
  --k-border: 1px solid rgba(0,200,160,.22);
  --k-shadow: 0 12px 40px rgba(0,120,255,.07);
  --k-cyan-glow: 0 0 16px rgba(0,163,255,.25);
  --k-lime-glow: 0 0 16px rgba(0,230,161,.30);
  --k-body: 'Inter','Noto Sans JP',-apple-system,sans-serif;
  --k-dot: 'DotGothic16',monospace;
  --k-fast: 90ms;
  --k-spring: 140ms;
  --k-slide: 480ms;
}

html{background:var(--k-bg);scroll-behavior:smooth}
body{
  background:
    radial-gradient(48rem 32rem at 0% 0%, rgba(0,230,161,.12), transparent 65%),
    radial-gradient(42rem 30rem at 100% 10%, rgba(0,163,255,.11), transparent 64%),
    linear-gradient(135deg,#F3F8F6 0%,#F7FBFA 48%,#F2F8F7 100%);
  color:var(--k-text);
  font-family:var(--k-body);
  letter-spacing:-.011em;
}
body::before{
  content:"";position:fixed;inset:-18%;pointer-events:none;z-index:-1;
  background:
    radial-gradient(circle at 18% 22%, rgba(0,230,161,.13), transparent 20%),
    radial-gradient(circle at 83% 18%, rgba(0,163,255,.12), transparent 23%),
    radial-gradient(circle at 72% 78%, rgba(180,255,120,.08), transparent 20%);
  filter:blur(32px) saturate(200%);
  animation:k-aurora-drift 16s ease-in-out infinite alternate;
}
@keyframes k-aurora-drift{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1.5%,1%,0) scale(1.02)}}

/* shared glass */
.topbar,
.nav,
.search,
.hero,
.card,
.detail,
.meta-box,
.download-box,
.feature,
.notice,
.loader,
.modal-card,
.app-identity-card,
.nav-drawer,
.store-main-panel,
.custom-select-trigger,
.custom-select-options,
.tool-card,
.stat-box,
.todo-item,
#qr-code-output,
#qr-tools,
footer{
  -webkit-backdrop-filter:blur(32px) saturate(200%);
  backdrop-filter:blur(32px) saturate(200%);
}

.k-beta-notice{
  display:flex;align-items:center;gap:12px;
  margin:0 0 18px;padding:11px 14px;
  background:var(--k-glass);border:var(--k-border);border-radius:12px;
  box-shadow:var(--k-shadow);
  color:var(--k-text);
}
.k-beta-dot{
  width:10px;height:10px;border-radius:50%;flex:0 0 auto;
  background:var(--k-lime);box-shadow:var(--k-lime-glow);
  animation:k-pulse 1.8s ease-in-out infinite;
}
@keyframes k-pulse{50%{transform:scale(1.18);opacity:.72}}
.k-beta-main{font-size:13px;font-weight:700}
.k-beta-tag{margin-left:auto;font:400 11px/1 var(--k-dot);letter-spacing:.06em;color:var(--k-cyan);white-space:nowrap}

/* press feedback */

  .app-shell{width:min(100% - 20px,680px)}.topbar{grid-template-columns:1fr auto;gap:8px;margin:0 -10px 10px;padding:9px 10px}.nav{grid-column:1/-1;grid-row:2;width:100%}.search{grid-column:1/-1;grid-row:3}.hero{padding:22px!important;min-height:0}.grid{gap:7px!important}.card.app-row-card{grid-template-columns:56px minmax(0,1fr);gap:12px;padding:13px!important}.card.app-row-card .icon{width:56px!important;height:56px!important}.card.app-row-card .desc{grid-column:2;grid-row:3}.card.app-row-card .card-footer{grid-column:2;grid-row:4;flex-direction:row;justify-content:space-between;align-items:center}.detail-head{grid-template-columns:80px 1fr;padding:16px!important;gap:14px}.detail-icon{width:80px!important;height:80px!important}.detail-title{font-size:28px!important}.detail-body{grid-template-columns:1fr!important;padding:14px!important}.meta-grid{grid-template-columns:repeat(3,1fr)!important}.download-box{grid-column:1!important;grid-row:auto!important;position:sticky;bottom:10px;top:auto;z-index:20}.about-title,.about,.features,.notice{grid-column:1!important}.features{grid-template-columns:1fr!important}
}
@media(max-width:500px){
  .topbar{align-items:center}.brand-mark{width:36px;height:36px}.brand-text{font-size:16px!important}.brand-sub{font-size:8px!important}.nav button{font-size:9px!important;padding:7px 9px!important}.hero h1{font-size:31px!important}.hero p{font-size:12px!important}.k-beta-tag{display:none}.list-home{display:none}.card.app-row-card .card-title{font-size:16px!important}.detail-head{grid-template-columns:1fr;text-align:center}.detail-icon{margin:0 auto}.detail-chips{justify-content:center}.meta-grid{grid-template-columns:1fr!important}.download-box{position:static}.feature{padding:13px!important}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}#k-transition-layer{display:none!important}}
</style>


<style id="k-ui-2-beta-store-stats">
.store-quick-stats{position:absolute;right:24px;bottom:22px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}.store-quick-stats span{padding:8px 9px;border:1px solid rgba(0,200,160,.17);border-radius:6px;background:rgba(255,255,255,.45);font:400 9px/1.25 var(--k-dot);color:var(--k-sub)}.store-quick-stats b{color:var(--k-text);font-family:var(--k-body);font-weight:700}@media(max-width:800px){.store-quick-stats{position:static;max-width:none;justify-content:flex-start;margin-top:18px}.hero{display:block!important}}
</style>

</head>


<body>


<!-- =======================================================
     Loading Screen
======================================================== -->

<div id="loading-screen" aria-hidden="true">

  <div class="loader">

    <div class="loader-logo">
      W
    </div>

    <div class="loader-text">
      windows11at Store
    </div>

    <div class="loader-sub">
      読み込み中…
    </div>

    <div class="loader-spinner"></div>

  </div>

</div>


<div class="app-shell">


  <!-- =====================================================
       Header
  ====================================================== -->

  <header class="topbar">

    <a
      href="#"
      class="brand"
      id="brandHome"
      aria-label="トップページへ戻る"
    >

      <div class="brand-mark">
        W
      </div>

      <div>

        <div class="brand-text">
          windows11at Store
        </div>

        <div class="brand-sub">
          Androidアプリの配布ストア
        </div>

      </div>

    </a>


    <nav
      class="nav"
      aria-label="ストアナビゲーション"
    >

      <button
        type="button"
        class="active"
        data-filter="all"
      >
        ホーム
      </button>

      <button
        type="button"
        data-filter="app"
      >
        アプリ
      </button>

      <button
        type="button"
        data-filter="game"
      >
        ゲーム
      </button>

      <button
        type="button"
        data-filter="all"
      >
        すべて
      </button>

    </nav>


    <label class="search">

      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >

        <circle
          cx="11"
          cy="11"
          r="6.5"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="m16 16 4.2 4.2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

      </svg>

      <input
        id="searchInput"
        type="search"
        placeholder="アプリを検索"
        autocomplete="off"
      >

    </label>

  </header>


  <div class="k-beta-notice" role="status">
    <span class="k-beta-dot" aria-hidden="true"></span>
    <span class="k-beta-main">新しいデザインをテスト中です。</span>
    <span class="k-beta-tag">K-UI 2.0 BETA</span>
  </div>


  <!-- =====================================================
       App List
  ====================================================== -->

  <main
    id="list-view"
    class="view active"
  >


    <!-- ★ index.html に戻る -->
    <div class="list-home">

      <button
        type="button"
        id="listHomeButton"
        class="home-button"
      >
        ← トップページに戻る
      </button>

    </div>


    <section class="hero">

      <div class="hero-content">

        <h1>
          アプリを探す
        </h1>

        <p>
          windows11at が公開しているアプリを、ここから入手できます。
        </p>

        <div class="hero-badge">
          ● 公開中のアプリを表示しています
        </div>

      </div>

    </section>


    <div class="section-head">

      <div>

        <div class="section-title">
          アプリ
        </div>

        <div class="section-sub">
          公開中・開発中のタイトル
        </div>

      </div>

    </div>


    <section
      id="app-grid"
      class="grid"
      aria-live="polite"
    ></section>

  </main>


  <!-- =====================================================
       Detail
  ====================================================== -->

  <main
    id="detail-view"
    class="view"
  >


    <div
      style="
        display:flex;
        align-items:center;
        gap:12px;
        flex-wrap:wrap;
        margin-bottom:14px;
      "
    >

      <button
        type="button"
        class="back"
        id="backButton"
      >
        ← アプリ一覧へ戻る
      </button>


      <button
        type="button"
        class="home-button"
        id="detailHomeButton"
      >
        ← トップページに戻る
      </button>

    </div>


    <section class="detail">


      <div class="detail-head">

        <div
          id="detail-icon"
          class="detail-icon"
        ></div>

        <div>

          <h1
            id="detail-name"
            class="detail-title"
          ></h1>

          <div
            id="detail-developer"
            class="detail-dev"
          ></div>

          <div
            id="detail-tags"
            class="detail-chips"
          ></div>

        </div>

      </div>


      <div class="detail-body">


        <div class="meta-grid">

          <div class="meta-box">

            <strong id="detail-version">
              —
            </strong>

            <span>
              バージョン
            </span>

          </div>


          <div class="meta-box">

            <strong id="detail-platform">
              —
            </strong>

            <span>
              対応環境
            </span>

          </div>


          <div class="meta-box">

            <strong id="detail-release">
              —
            </strong>

            <span>
              公開状態
            </span>

          </div>

        </div>


        <div class="download-box">

          <div>

            <strong>
              最新バージョン
            </strong>

            <small id="detail-file">
              —
            </small>

          </div>


          <button
            type="button"
            id="downloadButton"
            class="primary"
          >
            ダウンロード
          </button>

        </div>


        <div class="about-title">
          このアプリについて
        </div>


        <p
          id="detail-about"
          class="about"
        ></p>


        <div
          id="feature-list"
          class="features"
        ></div>


        <div
          id="detail-notice"
          class="notice"
        ></div>

      </div>

    </section>

  </main>


  <footer>
    © 2026 windows11at
  </footer>

</div>


<!-- =======================================================
     Download Modal
======================================================== -->

<div
  id="download-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-title"
>

  <div class="modal-card">


    <div class="modal-head">

      <div
        id="modal-icon"
        class="modal-icon"
      ></div>

      <div>

        <div
          id="modal-title"
          class="modal-title"
        >
          ダウンロード
        </div>

        <div
          id="modal-status"
          class="modal-status"
        >
          準備しています…
        </div>

      </div>

    </div>


    <div class="progress-wrap">

      <div
        class="progress-track"
        aria-label="ダウンロード進捗"
      >

        <div
          id="progress-bar"
          class="progress-bar"
        ></div>

      </div>


      <div class="progress-meta">

        <span id="progress-label">
          0%
        </span>

        <span id="progress-state">
          準備中
        </span>

      </div>

    </div>


    <div
      id="modal-note"
      class="modal-note"
    >
      ファイルを取得しています。
    </div>


    <div class="modal-actions">

      <button
        type="button"
        id="modalCancel"
        class="modal-cancel"
      >
        キャンセル
      </button>


      <button
        type="button"
        id="modalDone"
        class="modal-done"
      >
        閉じる
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   アイコン
========================================================= */

const leafIcon = `
<svg
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  <rect
    x="13"
    y="13"
    width="74"
    height="74"
    rx="20"
    fill="rgba(255,255,255,.20)"
    stroke="rgba(255,255,255,.9)"
    stroke-width="3"
  />

  <path
    d="M50 72C36 72 28 64 28 51C28 35 40 28 56 28C66 28 72 34 72 44C72 61 64 72 50 72Z"
    fill="white"
  />

  <path
    d="M29 71L71 29"
    stroke="#20c997"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
`;


/* =========================================================
   アプリ
========================================================= */

const apps = [

  {
    id:"leaf-meter",
    type:"app",

    name:"Leaf Meter",
    developer:"windows11at",

    version:"1.3.5",
    platform:"Android 10+",

    status:"公開中",

    file:"app1.zip",

    tags:[
      "Android",
      "家計管理",
      "最新版"
    ],

    description:
      "残高や購入後の推移を確認できる、自作の家計管理アプリ。",

    about:
      "残高計算・購入シミュレーション・ICカード読み取りなどをまとめたスマート家計管理ツール。",

    features:[

      [
        "家計を可視化",
        "残高や今日使える目安を確認"
      ],

      [
        "購入シミュレーション",
        "購入後の残金推移を計算"
      ],

      [
        "ICカード読み取り",
        "対応カードの情報を読み取り"
      ],

      [
        "データ管理・移行",
        "バックアップや機種変更に対応"
      ]

    ],

    notice:
      "Android向けの配布ファイルです。インストール時に端末のセキュリティ警告が表示された場合は、内容と配布元を確認してから判断してください。"
  },


  {
    id:"next-app",
    type:"app",

    name:"Next App",
    developer:"windows11at",

    version:"開発中",
    platform:"Android",

    status:"公開前",

    /*
      nullなのでダウンロード不可
    */
    file:null,

    tags:[
      "Coming Soon",
      "開発中"
    ],

    description:
      "次に公開予定の自作アプリ。現在も開発が進められています。",

    about:
      "現在開発中のため、ダウンロードはまだ利用できません。公開準備が整った段階で、このページから配布を開始します。",

    features:[

      [
        "開発中",
        "現在は開発・調整を進めています"
      ],

      [
        "公開準備中",
        "配布開始時にストア情報を更新します"
      ]

    ],

    notice:
      "このアプリは現在公開されていません。ダウンロードボタンも無効化されています。"
  }

];


/* =========================================================
   状態
========================================================= */

let currentFilter = "all";

let currentApp = null;

let activeController = null;

let activeReader = null;


/* =========================================================
   Utility
========================================================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


function renderIcon(){

  return leafIcon;

}


/* =========================================================
   Filter
========================================================= */

function filteredApps(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  return apps.filter(app => {

    const typeMatch =
      currentFilter === "all" ||
      app.type === currentFilter;


    const searchableText = [

      app.name,
      app.developer,
      app.description,
      app.about,
      app.platform,
      app.status,
      ...app.tags

    ]
      .join(" ")
      .toLowerCase();


    return (
      typeMatch &&
      (
        !query ||
        searchableText.includes(query)
      )
    );

  });

}


/* =========================================================
   Render Apps
========================================================= */

function renderApps(){

  const grid =
    document.getElementById(
      "app-grid"
    );


  const list =
    filteredApps();


  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        該当するアプリがありません。
      </div>
    `;

    return;

  }


  grid.innerHTML = list
    .map(app => {

      const statusClass =
        app.file
          ? "live"
          : "soon";


      const tags =
        app.tags
          .map(tag => {

            let cls = "chip";

            if(tag === "最新版"){
              cls += " live";
            }

            if(
              tag === "開発中" ||
              tag === "Coming Soon"
            ){
              cls += " soon";
            }

            return `
              <span class="${cls}">
                ${escapeHtml(tag)}
              </span>
            `;

          })
          .join("");


      return `

        <article class="card app-row-card">

          <div class="card-top">

            <div class="icon">
              ${renderIcon()}
            </div>


            <div>

              <div class="card-title">
                ${escapeHtml(app.name)}
              </div>

              <div class="developer">
                ${escapeHtml(app.developer)}
              </div>

              <div class="chips">
                ${tags}
              </div>

            </div>

          </div>


          <div class="desc">
            ${escapeHtml(app.description)}
          </div>


          <div class="card-footer">

            <span class="${statusClass}">
              ${
                app.file
                  ? "公開中"
                  : "公開前"
              }
            </span>


            <button
              type="button"
              class="card-link"
              data-open="${escapeHtml(app.id)}"
            >
              詳細を見る
            </button>

          </div>

        </article>

      `;

    })
    .join("");


  grid
    .querySelectorAll("[data-open]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          openDetail(
            button.dataset.open
          );

        }
      );

    });

}


/* =========================================================
   Detail
========================================================= */

function openDetail(id){

  const app =
    apps.find(
      item => item.id === id
    );


  if(!app){
    return;
  }


  currentApp = app;


  document.getElementById(
    "detail-icon"
  ).innerHTML =
    renderIcon();


  document.getElementById(
    "detail-name"
  ).textContent =
    app.name;


  document.getElementById(
    "detail-developer"
  ).textContent =
    "開発元: @" + app.developer;


  document.getElementById(
    "detail-tags"
  ).innerHTML =

    app.tags
      .map(tag => {

        let cls = "chip";

        if(tag === "最新版"){
          cls += " live";
        }

        if(
          tag === "開発中" ||
          tag === "Coming Soon"
        ){
          cls += " soon";
        }

        return `
          <span class="${cls}">
            ${escapeHtml(tag)}
          </span>
        `;

      })
      .join("");


  document.getElementById(
    "detail-version"
  ).textContent =
    app.version;


  document.getElementById(
    "detail-platform"
  ).textContent =
    app.platform;


  document.getElementById(
    "detail-release"
  ).textContent =
    app.status;


  document.getElementById(
    "detail-file"
  ).textContent =

    app.file
      ? `${app.file} · ダウンロード可能`
      : "現在はダウンロードできません";


  document.getElementById(
    "detail-about"
  ).textContent =
    app.about;


  document.getElementById(
    "feature-list"
  ).innerHTML =

    app.features
      .map(feature => `

        <div class="feature">

          <strong>
            ${escapeHtml(feature[0])}
          </strong>

          <span>
            ${escapeHtml(feature[1])}
          </span>

        </div>

      `)
      .join("");


  document.getElementById(
    "detail-notice"
  ).textContent =
    app.notice;


  const downloadButton =
    document.getElementById(
      "downloadButton"
    );


  /*
    fileがnullなら完全に無効化
  */

  downloadButton.disabled =
    !app.file;


  downloadButton.textContent =
    app.file
      ? "ダウンロード"
      : "公開前";


  document.getElementById(
    "list-view"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "detail-view"
  ).classList.add(
    "active"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   App List
========================================================= */

function showList(){

  document.getElementById(
    "detail-view"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "list-view"
  ).classList.add(
    "active"
  );


  currentApp = null;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  window.location.href =
    "index.html";

}


/* =========================================================
   Filter
========================================================= */

function setFilter(
  type,
  button
){

  currentFilter = type;


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(item => {

      item.classList.remove(
        "active"
      );

    });


  if(button){

    button.classList.add(
      "active"
    );

  }


  showList();

  renderApps();

}


/* =========================================================
   Modal Progress
========================================================= */

function setModalProgress(
  value,
  state,
  statusText
){

  const progress =
    Math.max(
      0,
      Math.min(
        100,
        value
      )
    );


  document.getElementById(
    "progress-bar"
  ).style.width =
    progress + "%";


  document.getElementById(
    "progress-label"
  ).textContent =
    Math.round(progress) + "%";


  document.getElementById(
    "progress-state"
  ).textContent =
    state;


  document.getElementById(
    "modal-status"
  ).textContent =
    statusText;

}


/* =========================================================
   Open Download Modal
========================================================= */

function openDownloadModal(){

  const modal =
    document.getElementById(
      "download-modal"
    );


  modal.classList.add(
    "show"
  );


  document.body.style.overflow =
    "hidden";


  document.getElementById(
    "modal-icon"
  ).innerHTML =
    renderIcon();


  document.getElementById(
    "modal-title"
  ).textContent =
    `${currentApp.name} をダウンロード`;


  document.getElementById(
    "modal-note"
  ).textContent =
    "ファイルを取得しています。";


  document.getElementById(
    "modalCancel"
  ).style.display =
    "inline-flex";


  document.getElementById(
    "modalDone"
  ).style.display =
    "none";


  setModalProgress(
    0,
    "準備中",
    "ファイルを準備しています…"
  );

}


/* =========================================================
   Close Modal
========================================================= */

function closeDownloadModal(){

  document
    .getElementById(
      "download-modal"
    )
    .classList.remove(
      "show"
    );


  document.body.style.overflow =
    "";


  activeController = null;

  activeReader = null;

}


/* =========================================================
   Finish
========================================================= */

function finishDownload(){

  document.getElementById(
    "modalCancel"
  ).style.display =
    "none";


  document.getElementById(
    "modalDone"
  ).style.display =
    "inline-flex";


  setModalProgress(
    100,
    "完了",
    "ダウンロードが完了しました。"
  );


  document.getElementById(
    "modal-note"
  ).textContent =
    "ダウンロードしたファイルを保存先から確認してください。";

}


/* =========================================================
   Direct Download
========================================================= */

function triggerDirectFileDownload(
  filePath
){

  const anchor =
    document.createElement(
      "a"
    );


  anchor.href =
    new URL(
      filePath,
      location.href
    ).href;


  anchor.download =
    filePath
      .split("/")
      .pop()
      ||
      "download";


  anchor.rel =
    "noopener";


  document.body.appendChild(
    anchor
  );


  anchor.click();


  anchor.remove();

}


/* =========================================================
   Blob Download
========================================================= */

function triggerFileDownload(
  blob,
  filename
){

  const url =
    URL.createObjectURL(
      blob
    );


  const anchor =
    document.createElement(
      "a"
    );


  anchor.href =
    url;


  anchor.download =
    filename
      .split("/")
      .pop()
      ||
      "download";


  anchor.rel =
    "noopener";


  document.body.appendChild(
    anchor
  );


  anchor.click();


  anchor.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1500
  );

}


/* =========================================================
   Start Download
========================================================= */

async function startDownload(){

  /*
    公開されていないアプリは
    ここでも念のため完全ブロック
  */

  if(
    !currentApp ||
    !currentApp.file ||
    activeController
  ){

    return;

  }


  openDownloadModal();


  /*
    file:// 直開き
  */

  if(
    location.protocol === "file:"
  ){

    setModalProgress(
      25,
      "準備中",
      "ダウンロードを開始しています…"
    );


    setTimeout(
      () => {

        triggerDirectFileDownload(
          currentApp.file
        );


        setModalProgress(
          100,
          "開始済み",
          "ダウンロードを開始しました。"
        );


        document.getElementById(
          "modal-note"
        ).textContent =
          "ブラウザのダウンロード一覧を確認してください。";


        document.getElementById(
          "modalCancel"
        ).style.display =
          "none";


        document.getElementById(
          "modalDone"
        ).style.display =
          "inline-flex";

      },
      350
    );


    return;

  }


  /*
    HTTP / HTTPS
  */

  activeController =
    new AbortController();


  try{

    const fileUrl =
      new URL(
        currentApp.file,
        location.href
      ).href;


    const response =
      await fetch(
        fileUrl,
        {
          method:"GET",

          signal:
            activeController.signal,

          cache:"no-store",

          credentials:"same-origin"
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const total =
      Number(
        response.headers.get(
          "content-length"
        )
      ) || 0;


    if(!response.body){

      const blob =
        await response.blob();


      triggerFileDownload(
        blob,
        currentApp.file
      );


      finishDownload();


      return;

    }


    activeReader =
      response.body.getReader();


    const chunks = [];


    let received = 0;


    while(true){

      const {
        done,
        value
      } =
        await activeReader.read();


      if(done){

        break;

      }


      if(value){

        chunks.push(
          value
        );


        received +=
          value.byteLength;


        if(total > 0){

          const percent =
            (
              received /
              total
            ) * 100;


          setModalProgress(
            percent,
            "ダウンロード中",
            "ファイルをダウンロードしています…"
          );

        }else{

          const estimated =
            Math.min(
              95,
              10 +
              (
                received /
                1024 /
                1024
              ) * 5
            );


          setModalProgress(
            estimated,
            "ダウンロード中",
            "ファイルをダウンロードしています…"
          );

        }

      }

    }


    const blob =
      new Blob(
        chunks
      );


    triggerFileDownload(
      blob,
      currentApp.file
    );


    finishDownload();


  }catch(error){

    /*
      キャンセル
    */

    if(
      error &&
      error.name === "AbortError"
    ){

      document.getElementById(
        "modal-status"
      ).textContent =
        "ダウンロードをキャンセルしました。";


      document.getElementById(
        "modal-note"
      ).textContent =
        "ダウンロードは中止されました。";


      document.getElementById(
        "modalCancel"
      ).style.display =
        "none";


      document.getElementById(
        "modalDone"
      ).style.display =
        "inline-flex";


      return;

    }


    /*
      通常ダウンロードにフォールバック
    */

    try{

      triggerDirectFileDownload(
        currentApp.file
      );


      setModalProgress(
        100,
        "開始済み",
        "ブラウザのダウンロードを開始しました。"
      );


      document.getElementById(
        "modal-note"
      ).textContent =
        "ブラウザのダウンロード一覧を確認してください。";


      document.getElementById(
        "modalCancel"
      ).style.display =
        "none";


      document.getElementById(
        "modalDone"
      ).style.display =
        "inline-flex";


    }catch(fallbackError){

      document.getElementById(
        "modal-status"
      ).textContent =
        "ダウンロードに失敗しました。";


      document.getElementById(
        "modal-note"
      ).textContent =
        "配布ファイルが見つからないか、サーバーから取得できませんでした。";


      document.getElementById(
        "modalCancel"
      ).style.display =
        "none";


      document.getElementById(
        "modalDone"
      ).style.display =
        "inline-flex";


      console.error(
        "Download failed:",
        error,
        fallbackError
      );

    }

  }finally{

    activeReader = null;

    activeController = null;

  }

}


/* =========================================================
   Cancel
========================================================= */

function cancelDownload(){

  if(activeController){

    activeController.abort();

  }

}

   Events
========================================================= */


/*
  ナビゲーション
*/

document
  .querySelectorAll(
    ".nav button"
  )

    button.addEventListener(
      "click",
      () => {

        setFilter(

        );

      }
    );

  });


/*

*/

document
  .getElementById(
    "searchInput"
  )

  );


/*
  アプリ一覧
*/

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    showList
  );


/*
  ★ 一覧 → index.html
*/

document
  .getElementById(

  )
  .addEventListener(

    goHome
  );


/*
  ★ 詳細 → index.html
*/

document
  .getElementById(
    "detailHomeButton"
  )
  .addEventListener(
    "click",
    goHome
  );


/*
  ★ ロゴ → index.html
*/

document
  .getElementById(
    "brandHome"
  )
  .addEventListener(
    "click",
    event => {

      event.preventDefault();

      goHome();

    }
  );


/*
  ダウンロード
*/

document
  .getElementById(
    "downloadButton"
  )
  .addEventListener(
    "click",
    startDownload
  );


/*
  キャンセル
*/

document
  .getElementById(
    "modalCancel"
  )
  .addEventListener(
    "click",
    cancelDownload
  );


/*
  閉じる
*/

document
  .getElementById(
    "modalDone"
  )
  .addEventListener(
    "click",
    closeDownloadModal
  );


/*
  モーダル外クリック
*/

document
  .getElementById(
    "download-modal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "download-modal" &&
        !activeController
      ){

        closeDownloadModal();

      }

    }
  );


/*
  Esc
*/

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      document
        .getElementById(
          "download-modal"
        )
        .classList
        .contains("show") &&
      !activeController
    ){

      closeDownloadModal();

    }

  }
);


/* =========================================================
   初期化
========================================================= */

renderApps();


/* =========================================================
   Loading
========================================================= */

window.addEventListener(
  "load",
  () => {

    setTimeout(
      () => {

        document
          .getElementById(
            "loading-screen"
          )
          .classList
          .add("hide");

      },
      450
    );

  }
);

</script>


<script id="k-ui-2-beta-behavior">
(() => {
  const layer = document.createElement('div');
  layer.id = 'k-transition-layer';
  document.body.appendChild(layer);

  const run = () => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    layer.classList.remove('run');
    void layer.offsetWidth;
    layer.classList.add('run');
  };

  const views = document.querySelectorAll('.view');
  if (views.length) {
    const observer = new MutationObserver(() => run());
    views.forEach(v => observer.observe(v, {attributes:true, attributeFilter:['class']}));
  }

  document.addEventListener('click', event => {
    if (event.target.closest('.card-link,.nav button,#backButton,#listHomeButton,#detailHomeButton')) run();
  }, true);
})();
</script>
