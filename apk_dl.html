<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="windows11at 自作アプリ配布ストア">
<title>windows11at Store</title>

<style>
:root{
  --bg:#f3f5f7;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --text:#172033;
  --muted:#667085;
  --line:#e5e7eb;

  --blue:#0d6efd;
  --cyan:#0dcaf0;
  --green:#20c997;

  --accent:linear-gradient(
    135deg,
    #0d6efd 0%,
    #0dcaf0 52%,
    #20c997 100%
  );

  --shadow:0 12px 35px rgba(17,24,39,.07);
  --shadow-hover:0 18px 45px rgba(17,24,39,.12);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Noto Sans JP",
    sans-serif;

  line-height:1.6;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================================================
   Layout
========================================================= */

.app-shell{
  width:min(1180px,calc(100% - 36px));
  margin:0 auto;
  padding:18px 0 56px;
}


/* =========================================================
   Header
========================================================= */

.topbar{
  display:flex;
  align-items:center;
  gap:18px;

  min-height:64px;

  margin-bottom:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;

  font-weight:800;
  letter-spacing:-.02em;
}

.brand-mark{
  width:42px;
  height:42px;

  border-radius:13px;

  display:grid;
  place-items:center;

  background:var(--accent);
  color:#fff;

  box-shadow:
    0 8px 22px rgba(13,110,253,.20);

  font-size:21px;
}

.brand-text{
  font-size:20px;
}

.brand-sub{
  margin-top:-1px;

  color:var(--muted);

  font-size:11px;
  font-weight:600;
}


/* =========================================================
   Navigation
========================================================= */

.nav{
  display:flex;
  align-items:center;
  gap:4px;

  padding:5px;

  background:rgba(255,255,255,.86);

  border:1px solid rgba(17,24,39,.05);

  border-radius:16px;

  box-shadow:var(--shadow);
}

.nav button{
  border:0;

  background:transparent;
  color:var(--muted);

  padding:9px 13px;

  border-radius:11px;

  font-size:13px;
  font-weight:700;
}

.nav button:hover,
.nav button.active{
  background:#edf6ff;
  color:#0874bd;
}


/* =========================================================
   Search
========================================================= */

.search{
  margin-left:auto;

  width:min(330px,38vw);

  display:flex;
  align-items:center;
  gap:8px;

  padding:10px 13px;

  background:#fff;

  border:1px solid var(--line);

  border-radius:14px;
}

.search svg{
  flex:0 0 auto;
  color:#7a8699;
}

.search input{
  width:100%;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:14px;
}

.search input::placeholder{
  color:#98a2b3;
}


/* =========================================================
   Views
========================================================= */

.view{
  display:none;
}

.view.active{
  display:block;
}


/* =========================================================
   TOPページへ戻る
========================================================= */

.list-home{
  display:flex;
  justify-content:flex-start;

  margin:0 0 18px;
}

.home-button{
  display:inline-flex;
  align-items:center;
  gap:8px;

  border:1px solid #b8d7ef;

  background:#ffffff;
  color:#0874bd;

  padding:11px 17px;

  border-radius:13px;

  font-size:13px;
  font-weight:800;

  box-shadow:
    0 7px 20px rgba(13,110,253,.08);

  transition:
    background .16s ease,
    border-color .16s ease,
    box-shadow .16s ease,
    transform .16s ease;
}

.home-button:hover{
  background:#eef8ff;

  border-color:#86bee7;

  box-shadow:
    0 11px 26px rgba(13,110,253,.13);

  transform:translateY(-1px);
}

.home-button:active{
  transform:translateY(0);

  box-shadow:
    0 5px 14px rgba(13,110,253,.08);
}


/* =========================================================
   Hero
========================================================= */

.hero{
  position:relative;
  overflow:hidden;

  margin-bottom:24px;
  padding:34px 36px;

  color:#fff;

  background:var(--accent);

  border-radius:28px;

  box-shadow:
    0 16px 42px rgba(13,110,253,.18);
}

.hero::before,
.hero::after{
  content:"";

  position:absolute;

  border-radius:50%;

  pointer-events:none;

  background:rgba(255,255,255,.12);
}

.hero::before{
  width:270px;
  height:270px;

  right:-110px;
  top:-145px;
}

.hero::after{
  width:180px;
  height:180px;

  left:-85px;
  bottom:-110px;

  background:rgba(255,255,255,.08);
}

.hero-content{
  position:relative;
  z-index:1;
}

.hero h1{
  margin:0 0 6px;

  font-size:31px;

  letter-spacing:-.03em;
}

.hero p{
  max-width:720px;

  margin:0;

  color:rgba(255,255,255,.92);

  font-size:14px;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;

  margin-top:18px;

  padding:7px 11px;

  border:1px solid rgba(255,255,255,.26);

  border-radius:999px;

  background:rgba(255,255,255,.13);

  font-size:11px;
  font-weight:800;
}


/* =========================================================
   Section
========================================================= */

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:14px;

  margin:0 4px 12px;
}

.section-title{
  font-size:20px;
  font-weight:800;
}

.section-sub{
  color:var(--muted);
  font-size:12px;
}


/* =========================================================
   Grid
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(300px,1fr));

  gap:16px;
}


/* =========================================================
   App Card
========================================================= */

.card{
  padding:20px;

  background:var(--surface);

  border:1px solid rgba(17,24,39,.06);

  border-radius:22px;

  box-shadow:var(--shadow);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.card:hover{
  transform:translateY(-3px);

  border-color:rgba(13,110,253,.14);

  box-shadow:var(--shadow-hover);
}

.card-top{
  display:flex;
  align-items:flex-start;

  gap:14px;
}

.icon{
  width:62px;
  height:62px;

  flex:0 0 auto;

  display:grid;
  place-items:center;

  background:var(--accent);

  border-radius:18px;

  color:#fff;

  box-shadow:
    0 9px 20px rgba(13,110,253,.15);
}

.icon svg{
  width:37px;
  height:37px;
}

.card-title{
  font-size:19px;
  font-weight:800;
  letter-spacing:-.02em;
}

.developer{
  margin-top:1px;

  color:var(--muted);

  font-size:12px;
}

.chips{
  display:flex;
  flex-wrap:wrap;

  gap:6px;

  margin-top:8px;
}

.chip{
  display:inline-flex;
  align-items:center;

  min-height:23px;

  padding:3px 8px;

  border-radius:999px;

  background:#f1f5f9;

  color:#506072;

  font-size:10px;
  font-weight:800;
}

.chip.live{
  background:#e9fbf4;
  color:#138a64;
}

.chip.soon{
  background:#fff5dc;
  color:#9a6500;
}

.desc{
  min-height:61px;

  margin-top:16px;

  color:#4b5563;

  font-size:13px;
}

.card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-top:16px;
  padding-top:14px;

  border-top:1px solid #eef1f4;
}

.card-footer span{
  color:var(--muted);

  font-size:12px;
  font-weight:700;
}

.card-footer span.live{
  color:#138a64;
}

.card-footer span.soon{
  color:#9a6500;
}

.card-link{
  border:0;

  padding:8px 11px;

  border-radius:10px;

  background:#eef6ff;

  color:#0874bd;

  font-size:12px;
  font-weight:800;
}

.card-link:hover{
  background:#e1f0ff;
}


/* =========================================================
   Empty
========================================================= */

.empty{
  grid-column:1 / -1;

  padding:46px 20px;

  text-align:center;

  background:#fff;

  border:1px solid var(--line);

  border-radius:20px;

  color:var(--muted);
}


/* =========================================================
   Detail
========================================================= */

.detail{
  overflow:hidden;

  background:var(--surface);

  border:1px solid rgba(17,24,39,.06);

  border-radius:24px;

  box-shadow:var(--shadow);
}

.detail-head{
  display:flex;
  align-items:center;

  gap:18px;

  padding:28px 30px;

  background:
    linear-gradient(
      180deg,
      #fbfdff 0%,
      #fff 100%
    );

  border-bottom:1px solid #edf0f3;
}

.detail-icon{
  width:88px;
  height:88px;

  flex:0 0 auto;

  display:grid;
  place-items:center;

  background:var(--accent);

  border-radius:24px;

  box-shadow:
    0 12px 28px rgba(13,110,253,.16);
}

.detail-icon svg{
  width:52px;
  height:52px;
}

.detail-title{
  margin:0;

  font-size:29px;
  font-weight:850;

  letter-spacing:-.03em;
}

.detail-dev{
  margin-top:2px;

  color:var(--muted);

  font-size:13px;
}

.detail-chips{
  display:flex;
  flex-wrap:wrap;

  gap:7px;

  margin-top:10px;
}

.detail-body{
  padding:26px 30px 32px;
}


/* =========================================================
   Meta
========================================================= */

.meta-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-bottom:20px;
}

.meta-box{
  padding:13px 14px;

  background:var(--surface-2);

  border:1px solid #edf0f3;

  border-radius:15px;
}

.meta-box strong{
  display:block;

  font-size:14px;
}

.meta-box span{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   Download
========================================================= */

.download-box{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:16px;

  margin-bottom:26px;

  padding:17px 18px;

  background:
    linear-gradient(
      135deg,
      #f8fbff 0%,
      #f2fffb 100%
    );

  border:1px solid rgba(13,110,253,.12);

  border-radius:17px;
}

.download-box strong{
  display:block;

  font-size:14px;
}

.download-box small{
  display:block;

  margin-top:2px;

  color:var(--muted);

  font-size:11px;
}

.primary{
  border:0;

  padding:11px 16px;

  border-radius:12px;

  background:var(--accent);

  color:#fff;

  font-size:13px;
  font-weight:800;

  box-shadow:
    0 8px 18px rgba(13,110,253,.18);

  transition:
    filter .16s ease,
    transform .16s ease;
}

.primary:hover:not(:disabled){
  filter:brightness(.98);

  transform:translateY(-1px);
}

.primary:disabled{
  opacity:.55;

  box-shadow:none;
}


/* =========================================================
   About
========================================================= */

.about-title{
  margin-bottom:8px;

  font-size:17px;
  font-weight:800;
}

.about{
  margin:0;

  color:#4b5563;

  font-size:13px;
}


/* =========================================================
   Features
========================================================= */

.features{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:18px;
}

.feature{
  padding:13px 14px;

  background:#fff;

  border:1px solid #edf0f3;

  border-radius:15px;
}

.feature strong{
  display:block;

  font-size:13px;
}

.feature span{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   Notice
========================================================= */

.notice{
  margin-top:20px;

  padding:13px 14px;

  background:#f8fafc;

  border:1px solid #edf0f3;

  border-radius:14px;

  color:#667085;

  font-size:11px;
}


/* =========================================================
   Back
========================================================= */

.back{
  border:0;

  padding:4px 0;

  background:transparent;

  color:#0874bd;

  font-size:13px;
  font-weight:800;
}


/* =========================================================
   Footer
========================================================= */

footer{
  margin-top:34px;

  text-align:center;

  color:#98a2b3;

  font-size:11px;
}


/* =========================================================
   Loading
========================================================= */

#loading-screen{
  position:fixed;

  inset:0;

  z-index:1000;

  display:grid;
  place-items:center;

  background:#f3f5f7;

  transition:
    opacity .28s ease,
    visibility .28s ease;
}

#loading-screen.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader{
  width:min(360px,calc(100vw - 40px));

  padding:28px;

  text-align:center;

  background:#fff;

  border:1px solid var(--line);

  border-radius:22px;

  box-shadow:var(--shadow);
}

.loader-logo{
  width:58px;
  height:58px;

  display:grid;
  place-items:center;

  margin:0 auto 15px;

  background:var(--accent);

  border-radius:18px;

  color:#fff;

  font-size:28px;
  font-weight:900;
}

.loader-text{
  font-size:13px;
  font-weight:700;
}

.loader-sub{
  margin-top:3px;

  color:var(--muted);

  font-size:11px;
}

.loader-spinner{
  width:22px;
  height:22px;

  margin:14px auto 0;

  border:3px solid #dce6ef;

  border-top-color:#0d6efd;

  border-radius:50%;

  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   Download Modal
========================================================= */

#download-modal{
  position:fixed;

  inset:0;

  z-index:1100;

  display:none;

  place-items:center;

  padding:18px;

  background:rgba(15,23,42,.38);
}

#download-modal.show{
  display:grid;
}

.modal-card{
  width:min(440px,100%);

  padding:24px;

  background:#fff;

  border:1px solid rgba(17,24,39,.08);

  border-radius:22px;

  box-shadow:
    0 26px 70px rgba(15,23,42,.22);
}

.modal-head{
  display:flex;
  align-items:center;

  gap:12px;
}

.modal-icon{
  width:52px;
  height:52px;

  display:grid;
  place-items:center;

  background:var(--accent);

  border-radius:15px;
}

.modal-icon svg{
  width:31px;
  height:31px;
}

.modal-title{
  font-size:16px;
  font-weight:800;
}

.modal-status{
  margin-top:2px;

  color:var(--muted);

  font-size:12px;
}

.progress-wrap{
  margin-top:20px;
}

.progress-track{
  overflow:hidden;

  height:10px;

  background:#e9eef3;

  border-radius:999px;
}

.progress-bar{
  width:0;
  height:100%;

  background:var(--accent);

  border-radius:999px;

  transition:width .16s ease;
}

.progress-meta{
  display:flex;
  justify-content:space-between;

  margin-top:8px;

  color:var(--muted);

  font-size:11px;
  font-weight:700;
}

.modal-note{
  margin-top:14px;

  padding:11px 12px;

  background:#f8fafc;

  border:1px solid #edf0f3;

  border-radius:12px;

  color:#667085;

  font-size:11px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;

  gap:8px;

  margin-top:17px;
}

.modal-cancel{
  border:1px solid #f0c8c5;

  padding:9px 14px;

  background:#fff;

  border-radius:10px;

  color:#b42318;

  font-size:12px;
  font-weight:800;
}

.modal-cancel:hover{
  background:#fff5f4;
}

.modal-done{
  display:none;

  border:0;

  padding:9px 14px;

  background:#172033;

  border-radius:10px;

  color:#fff;

  font-size:12px;
  font-weight:800;
}


/* =========================================================
   Responsive
========================================================= */

@media (max-width:820px){

  .topbar{
    flex-wrap:wrap;
  }

  .nav{
    order:3;

    width:100%;

    overflow:auto;
  }

  .search{
    order:2;

    width:100%;
    max-width:none;

    margin-left:0;
  }

  .meta-grid{
    grid-template-columns:1fr;
  }

  .features{
    grid-template-columns:1fr;
  }

}

@media (max-width:620px){

  .app-shell{
    width:min(100% - 24px,1180px);

    padding-top:12px;
  }

  .hero{
    padding:26px 22px;
  }

  .hero h1{
    font-size:26px;
  }

  .detail-head{
    align-items:flex-start;

    padding:22px;
  }

  .detail-body{
    padding:22px;
  }

  .detail-icon{
    width:74px;
    height:74px;

    border-radius:21px;
  }

  .detail-title{
    font-size:24px;
  }

  .download-box{
    flex-direction:column;
    align-items:stretch;
  }

  .primary{
    width:100%;
  }

  .home-button{
    width:100%;
    justify-content:center;
  }

}
</style>
</head>


<body>


<!-- =======================================================
     Loading Screen
======================================================== -->

<div id="loading-screen" aria-hidden="true">

  <div class="loader">

    <div class="loader-logo">
      W
    </div>

    <div class="loader-text">
      windows11at Store
    </div>

    <div class="loader-sub">
      読み込み中…
    </div>

    <div class="loader-spinner"></div>

  </div>

</div>


<div class="app-shell">


  <!-- =====================================================
       Header
  ====================================================== -->

  <header class="topbar">

    <a
      href="#"
      class="brand"
      id="brandHome"
      aria-label="トップページへ戻る"
    >

      <div class="brand-mark">
        W
      </div>

      <div>

        <div class="brand-text">
          windows11at Store
        </div>

        <div class="brand-sub">
          自作アプリ配布 &amp; 開発ライブラリ
        </div>

      </div>

    </a>


    <nav
      class="nav"
      aria-label="ストアナビゲーション"
    >

      <button
        type="button"
        class="active"
        data-filter="all"
      >
        ホーム
      </button>

      <button
        type="button"
        data-filter="app"
      >
        アプリ
      </button>

      <button
        type="button"
        data-filter="game"
      >
        ゲーム
      </button>

      <button
        type="button"
        data-filter="all"
      >
        すべて
      </button>

    </nav>


    <label class="search">

      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >

        <circle
          cx="11"
          cy="11"
          r="6.5"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="m16 16 4.2 4.2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

      </svg>

      <input
        id="searchInput"
        type="search"
        placeholder="アプリを検索"
        autocomplete="off"
      >

    </label>

  </header>


  <!-- =====================================================
       App List
  ====================================================== -->

  <main
    id="list-view"
    class="view active"
  >


    <!-- ★ index.html に戻る -->
    <div class="list-home">

      <button
        type="button"
        id="listHomeButton"
        class="home-button"
      >
        ← トップページに戻る
      </button>

    </div>


    <section class="hero">

      <div class="hero-content">

        <h1>
          アプリを見つけよう
        </h1>

        <p>
          windows11at が開発しているアプリやツールを、
          ここから入手できます。
        </p>

        <div class="hero-badge">
          ● 公開中のアプリを表示しています
        </div>

      </div>

    </section>


    <div class="section-head">

      <div>

        <div class="section-title">
          アプリ
        </div>

        <div class="section-sub">
          公開中・開発中のタイトル
        </div>

      </div>

    </div>


    <section
      id="app-grid"
      class="grid"
      aria-live="polite"
    ></section>

  </main>


  <!-- =====================================================
       Detail
  ====================================================== -->

  <main
    id="detail-view"
    class="view"
  >


    <div
      style="
        display:flex;
        align-items:center;
        gap:12px;
        flex-wrap:wrap;
        margin-bottom:14px;

/* =========================================================
   状態
========================================================= */

let currentFilter = "all";

let currentApp = null;

let activeController = null;

let activeReader = null;


/* =========================================================
   Utility
========================================================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


function renderIcon(){

  return leafIcon;

}


/* =========================================================
   Filter
========================================================= */

function filteredApps(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  return apps.filter(app => {

    const typeMatch =
      currentFilter === "all" ||
      app.type === currentFilter;


    const searchableText = [

      app.name,
      app.developer,
      app.description,
      app.about,
      app.platform,
      app.status,
      ...app.tags

    ]
      .join(" ")
      .toLowerCase();


    return (
      typeMatch &&
      (
        !query ||
        searchableText.includes(query)
      )
    );

  });

}


/* =========================================================
   Render Apps
========================================================= */

function renderApps(){

  const grid =
    document.getElementById(
      "app-grid"
    );


  const list =
    filteredApps();


  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        該当するアプリがありません。
      </div>
    `;

    return;

  }


  grid.innerHTML = list
    .map(app => {

      const statusClass =
        app.file
          ? "live"
          : "soon";


      const tags =
        app.tags
          .map(tag => {

            let cls = "chip";

            if(tag === "最新版"){
              cls += " live";
            }

            if(
              tag === "開発中" ||
              tag === "Coming Soon"
            ){
              cls += " soon";
            }

            return `
              <span class="${cls}">
                ${escapeHtml(tag)}
              </span>
            `;

          })
          .join("");


      return `

        <article class="card">

          <div class="card-top">

            <div class="icon">
              ${renderIcon()}
            </div>


            <div>

              <div class="card-title">
                ${escapeHtml(app.name)}
              </div>

              <div class="developer">
                ${escapeHtml(app.developer)}
              </div>

              <div class="chips">
                ${tags}
              </div>

            </div>

          </div>


          <div class="desc">
            ${escapeHtml(app.description)}
          </div>


          <div class="card-footer">

            <span class="${statusClass}">
              ${
                app.file
                  ? "公開中"
                  : "公開前"
              }
            </span>


            <button
              type="button"
              class="card-link"
              data-open="${escapeHtml(app.id)}"
            >
              詳細を見る
            </button>

          </div>

        </article>

      `;

    })
    .join("");


  grid
    .querySelectorAll("[data-open]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          openDetail(
            button.dataset.open
          );

        }
      );

    });

}

/* =========================================================
   Modal Progress
========================================================= */

function setModalProgress(
  value,
  state,
  statusText
){

      Math.min(
        100,

      )
    );

  ).style.width =

  document.getElementById(

    Math.round(progress) + "%";

}


/* =========================================================
   Open Download Modal
========================================================= */

function openDownloadModal(){

  document.body.style.overflow =

  ).textContent =

  document.getElementById(
    "modal-note"

  document.getElementById(
    "modalCancel"
  ).style.display =
    "inline-flex";


  document.getElementById(
    "modalDone"

    0,

    "ファイルを準備しています…"
  );

}


/* =========================================================
   Close Modal
========================================================= */

function closeDownloadModal(){

  document
    .getElementById(
      "download-modal"
    )
    .classList.remove(
      "show"
    );


  document.body.style.overflow =
    "";


  activeController = null;

  activeReader = null;

}


/* =========================================================
   Finish
========================================================= */

function finishDownload(){

  document.getElementById(
    "modalCancel"
  ).style.display =
    "none";


  document.getElementById(
    "modalDone"
  ).style.display =
    "inline-flex";


  setModalProgress(
    100,
    "完了",
    "ダウンロードが完了しました。"
  );


  document.getElementById(
    "modal-note"
  ).textContent =
    "ダウンロードしたファイルを保存先から確認してください。";

}


/* =========================================================
   Direct Download
========================================================= */

function triggerDirectFileDownload(
  filePath
){

  const anchor =
    document.createElement(
      "a"
    );


  anchor.href =
    new URL(
      filePath,
      location.href
    ).href;


  anchor.download =
    filePath
      .split("/")
      .pop()
      ||
      "download";


  anchor.rel =
    "noopener";


  document.body.appendChild(
    anchor
  );


  anchor.click();


  anchor.remove();

}


/* =========================================================
   Blob Download
========================================================= */

function triggerFileDownload(
  blob,
  filename
){

  const url =
    URL.createObjectURL(
      blob
    );


  const anchor =
    document.createElement(
      "a"
    );


  anchor.href =
    url;


  anchor.download =
    filename
      .split("/")
      .pop()
      ||
      "download";


  anchor.rel =
    "noopener";


  document.body.appendChild(
    anchor
  );


  anchor.click();


  anchor.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1500
  );

}


/* =========================================================
   Start Download
========================================================= */

async function startDownload(){

  /*
    公開されていないアプリは
    ここでも念のため完全ブロック
  */

  if(
    !currentApp ||
    !currentApp.file ||
    activeController
  ){

    return;

  }


  openDownloadModal();


  /*
    file:// 直開き
  */

  if(
    location.protocol === "file:"
  ){

    setModalProgress(
      25,
      "準備中",
      "ダウンロードを開始しています…"
    );


    setTimeout(
      () => {

        triggerDirectFileDownload(
          currentApp.file
        );


        setModalProgress(
          100,
          "開始済み",
          "ダウンロードを開始しました。"
        );


        document.getElementById(
          "modal-note"
        ).textContent =
          "ブラウザのダウンロード一覧を確認してください。";


        document.getElementById(
          "modalCancel"
        ).style.display =
          "none";


        document.getElementById(
          "modalDone"
        ).style.display =
          "inline-flex";

      },
      350
    );


    return;

  }


  /*
    HTTP / HTTPS
  */

  activeController =
    new AbortController();


  try{

    const fileUrl =
      new URL(
        currentApp.file,
        location.href
      ).href;


    const response =
      await fetch(
        fileUrl,
        {
          method:"GET",

          signal:
            activeController.signal,

          cache:"no-store",

          credentials:"same-origin"
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const total =
      Number(
        response.headers.get(
          "content-length"
        )
      ) || 0;


    if(!response.body){

      const blob =
        await response.blob();


      triggerFileDownload(
        blob,
        currentApp.file
      );


      finishDownload();


      return;

    }


    activeReader =
      response.body.getReader();


    const chunks = [];


    let received = 0;


    while(true){

      const {
        done,
        value
      } =
        await activeReader.read();


      if(done){

        break;

      }


      if(value){

        chunks.push(
          value
        );


        received +=
          value.byteLength;


        if(total > 0){

          const percent =
            (
              received /
              total
            ) * 100;


          setModalProgress(
            percent,
            "ダウンロード中",
            "ファイルをダウンロードしています…"
          );

        }else{

          const estimated =
            Math.min(
              95,
              10 +
              (
                received /
                1024 /
                1024
              ) * 5
            );


          setModalProgress(
            estimated,
            "ダウンロード中",
            "ファイルをダウンロードしています…"
          );

        }

      }

    }


    const blob =
      new Blob(
        chunks
      );


    triggerFileDownload(
      blob,
      currentApp.file
    );


    finishDownload();


  }catch(error){

    /*
      キャンセル
    */

    if(
      error &&
      error.name === "AbortError"
    ){

      document.getElementById(
        "modal-status"
      ).textContent =
        "ダウンロードをキャンセルしました。";


      document.getElementById(
        "modal-note"
      ).textContent =
        "ダウンロードは中止されました。";


      document.getElementById(
        "modalCancel"
      ).style.display =
        "none";


      document.getElementById(
        "modalDone"
      ).style.display =
        "inline-flex";


      return;

    }


    /*
      通常ダウンロードにフォールバック
    */

    try{

      triggerDirectFileDownload(
        currentApp.file
      );


      setModalProgress(
        100,
        "開始済み",
        "ブラウザのダウンロードを開始しました。"
      );


      document.getElementById(
        "modal-note"
      ).textContent =
        "ブラウザのダウンロード一覧を確認してください。";


      document.getElementById(
        "modalCancel"
      ).style.display =
        "none";


      document.getElementById(
        "modalDone"
      ).style.display =
        "inline-flex";


    }catch(fallbackError){

      document.getElementById(
        "modal-status"
      ).textContent =
        "ダウンロードに失敗しました。";


      document.getElementById(
        "modal-note"
      ).textContent =
        "配布ファイルが見つからないか、サーバーから取得できませんでした。";


      document.getElementById(
        "modalCancel"
      ).style.display =
        "none";


      document.getElementById(
        "modalDone"
      ).style.display =
        "inline-flex";


      console.error(
        "Download failed:",
        error,
        fallbackError
      );

    }

  }finally{

    activeReader = null;

    activeController = null;

  }

}

  );


/*
  キャンセル
*/

document
  .getElementById(
    "modalCancel"
  )
  .addEventListener(
    "click",
    cancelDownload
  );


/*
  閉じる
*/

document
  .getElementById(
    "modalDone"
  )
  .addEventListener(
    "click",
    closeDownloadModal
  );


/*
  モーダル外クリック
*/

document
  .getElementById(
    "download-modal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "download-modal" &&
        !activeController
      ){

        closeDownloadModal();

      }

    }
  );


/*
  Esc
*/

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      document
        .getElementById(
          "download-modal"
        )
        .classList
        .contains("show") &&
      !activeController
    ){

      closeDownloadModal();

    }

  }
);


/* =========================================================
   初期化
========================================================= */

renderApps();


/* =========================================================
   Loading
========================================================= */

window.addEventListener(
  "load",
  () => {

    setTimeout(
      () => {

        document
          .getElementById(
            "loading-screen"
          )
          .classList
          .add("hide");

      },
      450
    );

  }
);

</script>

</body>
</html>
