<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリダウンロード | windows11at</title>
    <style>
        /* Aero-SQUI 1.0 共通テーマ定義 */
        :root {
            --bg-page: #f3f4f6;
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --highlight-line: rgba(255, 255, 255, 0.7);
            --shadow-ambient: rgba(13, 17, 29, 0.06);
            --aurora-start: #38bdf8;
            --aurora-mid: #a5b4fc;
            --aurora-end: #c084fc;
            --glow-color: rgba(165, 180, 252, 0.35);
            
            --color-x: #000000;
            --color-youtube: #ff0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* ヘッダー構造（index.htmlと統一） */
        header {
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .blog-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #0d111d;
            text-decoration: none;
            display: inline-block;
        }

        .blog-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* 💻 📱 PC・スマホ分岐レイアウト（Store風2カラム） */
        .store-layout {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @media (min-width: 768px) {
            body { padding: 40px 20px; }
            header { margin-bottom: 32px; }
            .blog-title { font-size: 28px; }
            .store-layout { flex-direction: row; align-items: flex-start; gap: 32px; }
            .store-sidebar { width: 300px; position: sticky; top: 40px; }
            .store-main { flex: 1; }
        }

        /* Microsoft Store風：左側/上部 アプリ情報カード */
        .app-identity-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-top: 1px solid var(--highlight-line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px var(--shadow-ambient);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ストア風カスタムアイコンコンテナ */
        .app-icon-placeholder {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--aurora-start), var(--aurora-end));
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 12px 28px var(--glow-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* SVGの微調整 */
        .app-icon-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
        }

        .app-name {
            font-size: 20px;
            font-weight: 600;
            color: #0d111d;
            margin-bottom: 4px;
        }

        .app-developer {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        /* ストア風状態バッジ */
        .store-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 24px;
            display: inline-block;
        }

        /* Microsoft Store風：右側/下部 メインコンテンツ */
        .store-main-panel {
            background: var(--bg-card);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-top: 1px solid var(--highlight-line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px var(--shadow-ambient);
            margin-bottom: 24px;
        }

        @media (min-width: 768px) {
            .store-main-panel { padding: 32px; }
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #0d111d;
            margin-bottom: 12px;
        }

        /* Coming Soon セクション（ストアの製品説明風） */
        .coming-soon-box {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }

        .coming-soon-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #0284c7, var(--aurora-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .coming-soon-desc {
            font-size: 13px;
            color: var(--text-sub);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* SNSリンクボタン */
        .sns-button-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .sns-button-list { flex-direction: row; }
        }

        .btn-store-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.1s, background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-store-action:active { transform: scale(0.98); }

        .btn-x {
            background-color: var(--color-x);
            color: white;
        }
        .btn-youtube {
            background-color: rgba(0, 0, 0, 0.04);
            color: var(--text-main);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .btn-youtube:hover {
            background-color: rgba(0, 0, 0, 0.08);
        }

        .btn-store-action svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ナビゲーションフッターリンク */
        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 4px;
            transition: color 0.2s;
        }
        .back-nav:hover {
            color: #0284c7;
        }

        /* フッター */
        footer {
            margin-top: 40px;
            padding: 20px 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 11px;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー（index.htmlから統一） -->
        <header>
            <a href="index.html" class="blog-title">windows11at</a>
            <div class="blog-subtitle">ガジェット要塞と自作アプリ開発の記録</div>
        </header>

        <!-- ストアレイアウト -->
        <div class="store-layout">
            
            <!-- 左側（PC時）：アプリのアイデンティティ -->
            <aside class="store-sidebar">
                <div class="app-identity-card">
                    <!-- カスタムSVGアプリアイコン -->
                    <div class="app-icon-placeholder">
                        <svg class="app-icon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- 外側のサイバーフレーム（スマートフォンのアスペクト比を抽象化） -->
                            <rect x="16" y="10" width="68" height="80" rx="14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-dasharray="160 20" opacity="0.9"/>
                            
                            <!-- 中央のコア・シンボル（透過するガラスプレート風のサイバーインジケータ） -->
                            <rect x="30" y="25" width="40" height="50" rx="8" fill="white" fill-opacity="0.15" stroke="white" stroke-width="2.5"/>
                            <rect x="38" y="33" width="24" height="34" rx="4" stroke="white" stroke-width="1.5" opacity="0.7"/>
                            
                            <!-- 上下のデバイスギミック（スピーカーホールとホームインジケータ） -->
                            <line x1="44" y1="16" x2="56" y2="16" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
                            <circle cx="50" cy="80" r="3" fill="white" opacity="0.9"/>
                            
                            <!-- アクセント（ガジェットの画面の光沢を模した斜めのカッティングライン） -->
                            <path d="M25 80L75 30" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
                        </svg>
                    </div>
                    
                    <h1 class="app-name">自作アプリ(仮)</h1>
                    <p class="app-developer">@windows11at</p>
                    <div class="store-store-status">
                        <span class="store-badge">Android アプリ配布準備中</span>
                    </div>
                </div>
            </aside>

            <!-- 右側（PC時）：詳細パネル・ダウンロード情報 -->
            <main class="store-main">
                <div class="store-main-panel">
                    <h2 class="panel-title">概要と配信ステータス</h2>
                    
                    <!-- 製品準備中エリア -->
                    <div class="coming-soon-box">
                        <div class="coming-soon-text">Coming Soon...</div>
                        <p class="coming-soon-desc">
                            現在、快適なUIデザインと基本システムの開発を進めています。配信開始までもうしばらくお待ちください。最新の進捗やテスト配布の案内は各公式チャンネルで発信します。
                        </p>
                    </div>

                    <h2 class="panel-title">コミュニティ & 進捗状況</h2>
                    <div class="sns-button-list">
                        <!-- X -->
                        <a href="https://x.com/windows11at" target="_blank" rel="noopener noreferrer" class="btn-store-action btn-x">
                            <svg viewBox="0 0 24 24">
                                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                            </svg>
                            X で進捗を確認
                        </a>
                        
                        <!-- YouTube -->
                        <a href="https://youtube.com/@windows11at" target="_blank" rel="noopener noreferrer" class="btn-store-action btn-youtube">
                            <svg viewBox="0 0 24 24">
                                <path d="M23.498 6.163a3.003 3.003 0 0 0-2.11-2.11C19.517 3.545 12 3.545 12 3.545s-7.517 0-9.388.507a3.003 3.003 0 0 0-2.11 2.11C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 0 0 2.11 2.11c1.871.507 9.388.507 9.388.507s7.517 0 9.388-.507a3.003 3.003 0 0 0 2.11-2.11C24 15.967 24 12 24 12s0-3.967-.502-5.837zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                            </svg>
                            YouTube チャンネル
                        </a>
                    </div>
                </div>

                <!-- ナビゲーション（戻るリンク） -->
                <a href="index.html" class="back-nav">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    公式サイトのトップへ戻る
                </a>
            </main>

        </div>

        <!-- フッター -->
        <footer>
            <div>© 2026 windows11at</div>
        </footer>
    </div>

</body>
</html>
